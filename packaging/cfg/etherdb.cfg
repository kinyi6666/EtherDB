# ============================================================================
# EtherDB Server Configuration
# ============================================================================
# Default location: /etc/etherdb/etherdb.cfg
# Command-line: etherdb_server -c /path/to/etherdb.cfg
# ============================================================================

# ----------------------------------------------------------------------------
# [server] — Network and threading settings
# ----------------------------------------------------------------------------
[server]
# Client-facing shell server port
#shellPort = 7040

# Inter-node communication port (for multi-machine cluster)
#peerPort = 7042

# Number of CPU cores to use
numCores = 4

# Number of worker threads per core
threadsPerCore = 1

# Ratio of query threads to total threads (0.0 ~ 1.0)
queryCoreRatio = 0.5

# Maximum number of concurrent client connections
maxShellConns = 5000

# Connection idle timeout (seconds)
shellIdleTime = 3600

# ----------------------------------------------------------------------------
# [monitor] — HTTP monitoring endpoint (Prometheus / Grafana)
# ----------------------------------------------------------------------------
[monitor]
# Enable the HTTP monitor (0 = disabled)
enabled = 1

# HTTP port for /metrics, /api/v1/status, /api/v1/health, /api/v1/slowlog
port = 9187

# Queries slower than this (milliseconds) are counted as slow queries
slowQueryMs = 100

# ----------------------------------------------------------------------------
# [storage] — Data storage settings
# ----------------------------------------------------------------------------
[storage]
# Root data directory for all storage files
#dataDir = "/var/lib/etherdb/etherdb_data"

# ----------------------------------------------------------------------------
# [log] — Logging settings
# ----------------------------------------------------------------------------
[log]
# Log output directory
#logDir = "/var/log/etherdb/etherdb_log"

# Minimum log level: trace, debug, info, warn, error
#   trace — most verbose (all messages)
#   debug — debugging messages
#   info  — informational messages (default)
#   warn  — warnings only
#   error — errors only
logLevel = "info"

# Enable per-module log level override (uncomment to set)
# logLevel.dnode   = "debug"
# logLevel.etdb    = "info"
# logLevel.dbnode   = "warn"
# logLevel.query   = "info"
# logLevel.rpc     = "warn"

# Maximum log file size before rotation (MB)
logMaxSizeMB = 256

# Log rotation: keep this many old log files
logRetainCount = 10

# ----------------------------------------------------------------------------
# [network] — Network endpoints
# ----------------------------------------------------------------------------
[network]
# Primary endpoint (used by clients to discover the cluster)
#primaryEp = "localhost:7040"

# ----------------------------------------------------------------------------
# [auth] — Authentication settings
# ----------------------------------------------------------------------------
[auth]
# Enable authentication (false = allow all connections)
authEnabled = true

# Default superuser credentials (created on first startup)
defaultUser = "root"
defaultPassword = "etherdbdata"
